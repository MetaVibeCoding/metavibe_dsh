[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metavibe"
version = "0.1.0"
description = "AI-Native Meta-Architecture & Anti-Entropy Platform for Vibe Coding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
]

[project.scripts]
metavibe = "metavibe.cli:app"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
